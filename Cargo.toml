[workspace]
resolver = "2"
members = [
    "crates/grasm_syntax",
    "crates/grasm_sema",
    "crates/grasm_interp",
    "crates/grasm_native",
    "crates/grasm_lsp",
    "crates/grasm_dap",
    "crates/grasm_spec",
    "crates/grasm_pkg",
    "crates/grasm_journal",
    "crates/grasm_fiber",
    "crates/grasm_sys",
    "crates/grasm_rt",
    "crates/grasm_rt_abi",
    "crates/grasm_wasm",
    "crates/grasm",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
# Required, not chosen: a `no_std` crate has no unwinder, and the compiler
# refuses to build one that could unwind. The note below about this saving
# only 1 KB was measured when `std` was still linked.
panic = "abort"
# `panic = "abort"` was tried here and reverted: it saved 1 KB. The 39 KB of
# unwinding tables in a compiled program come from Rust's *precompiled* `std`,
# which this setting cannot reach — removing them needs `-Z build-std` (nightly,
# so not available to a stable toolchain) or a `no_std` runtime. Recorded so the
# next person does not spend the afternoon finding that out again.

# `[profile.release.package.grasm_rt] opt-level = "z"` was tried here and
# reverted: it made a compiled program 4 KB *bigger*. Optimising the runtime for
# size blocks the inlining that lets link-time optimisation delete the code
# around it, so the archive shrinks and the binary grows. Measured, not assumed.
