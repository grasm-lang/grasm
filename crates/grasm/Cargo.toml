[package]
name = "grasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "grasm"
path = "src/main.rs"

[dependencies]
# For `grasm journal` — reading a recording back out.
grasm_journal = { path = "../grasm_journal" }
grasm_syntax = { path = "../grasm_syntax" }
grasm_sema = { path = "../grasm_sema" }
grasm_interp = { path = "../grasm_interp" }
grasm_native = { path = "../grasm_native" }
grasm_lsp = { path = "../grasm_lsp" }
grasm_dap = { path = "../grasm_dap" }
grasm_pkg = { path = "../grasm_pkg" }
