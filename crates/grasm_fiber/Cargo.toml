[package]
name = "grasm_fiber"
version.workspace = true
edition.workspace = true
license.workspace = true

# Stackful fibers for concurrent tasks (docs/concurrency.md): stacks and a
# context switch, shared by the native runtime and the interpreter so the two
# cannot disagree about scheduling. No dependencies, like `grasm_rt`, which
# will link it.
[dependencies]
# Thread-local storage and the rest of the operating system, so this crate can
# be `no_std` too -- it links into every compiled program.
grasm_sys = { path = "../grasm_sys" }
