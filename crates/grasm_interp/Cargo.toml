[package]
name = "grasm_interp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
grasm_syntax = { path = "../grasm_syntax" }
grasm_sema = { path = "../grasm_sema" }
# The journal, not the runtime. The interpreter has its own implementation of
# every builtin, so what it shares with the compiled engines is the *format* —
# and sharing that is what lets a recording made by one engine replay under
# another. It must not reach for `grasm_rt`: that runtime is written for a
# 64-bit host, and this crate is also the browser build.
grasm_journal = { path = "../grasm_journal" }
