[package]
name = "chat-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chat-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
