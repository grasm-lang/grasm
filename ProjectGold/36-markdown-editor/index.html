<!doctype html>
<meta charset="utf-8">
<title>Editor — one compiler</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.55 system-ui, sans-serif; margin: 0; height: 100vh;
         display: flex; flex-direction: column; }
  header { padding: 0.75rem 1.25rem; display: flex; align-items: baseline;
           gap: 1rem; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
  h1 { font-size: 0.95rem; font-weight: 600; margin: 0; }
  .note { opacity: 0.7; font-size: 0.8rem; }
  button { font: inherit; padding: 0.25rem 0.8rem; border: 1px solid currentColor;
           border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button[disabled] { opacity: 0.45; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  textarea { font: 14px/1.6 ui-monospace, monospace; border: 0; resize: none;
             padding: 1.25rem; background: transparent; color: inherit; outline: none;
             border-right: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
  #preview { padding: 1.25rem; overflow: auto; }
  #preview h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  #preview h2 { font-size: 1.15rem; }
  #preview code { font-family: ui-monospace, monospace;
                  background: color-mix(in srgb, currentColor 10%, transparent);
                  padding: 0.1em 0.3em; border-radius: 3px; }
  @media (max-width: 40rem) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>

<header>
  <h1>Editor</h1>
  <span class="note" id="status">connecting…</span>
  <span style="flex:1"></span>
  <button id="publish" disabled>Publish</button>
</header>
<main>
  <textarea id="src" spellcheck="false"># Live

Type on the left. The preview is compiled by the *same* Grasm
compiler the server publishes with — `lib_markdown`, running here
in wasm.

- the preview runs in wasm, from `bundle.gr`
- publishing is the only round trip, and it must agree
</textarea>
  <div id="preview"></div>
</main>

<script>
  const API = "http://localhost:8977";
  const src = document.getElementById("src");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const publish = document.getElementById("publish");

  let compiled = null, source = null;

  // The clock is imported because `std::time` panics on this target and a
  // panic with no unwinding is an abort. `dlsym` is reached through Rust's std.
  const imports = {
    env: {
      grasm_now_millis: () => Date.now(),
      // Monotonic, so a duration measured with it cannot go backwards.
      grasm_monotonic_millis: () => performance.now(),
      // A call from wasm into the host is synchronous and the host cannot
      // yield inside one, so the wait is a spin.
      grasm_sleep_millis: (ms) => {
        const until = performance.now() + ms;
        while (performance.now() < until) {}
      },
      dlsym: () => 0,
    },
  };

  // A document travels as one line, because `input()` reads one line. This is
  // the encoding `decode_line` in main.gr undoes.
  const encodeDoc = d => d.replace(/\\/g, "\\\\").replace(/\n/g, "\\n");

  // `bundle.gr` is this project's whole program — main.gr and lib_markdown —
  // as one file, written by `grasm build --source`.
  //
  // The first version of this page fetched `main.gr` and could not run it:
  // `grasm_run_with_stdin` takes one source string and wasm32 has no
  // filesystem, so an `import` cannot be resolved. That was ProjectGold F33,
  // and closing it is what put this preview back on the compiler it claims.
  function render() {
    if (!compiled) return;
    const ex = new WebAssembly.Instance(compiled, imports).exports;
    const mem = () => new Uint8Array(ex.memory.buffer);
    const enc = new TextEncoder();
    const s = enc.encode(source);
    const sp = ex.grasm_alloc(s.length);
    mem().set(s, sp);
    const i = enc.encode(encodeDoc(src.value) + "\n");
    const ip = ex.grasm_alloc(i.length);
    mem().set(i, ip);
    const res = ex.grasm_run_with_stdin(sp, s.length, ip, i.length);
    ex.grasm_free(sp, s.length);
    ex.grasm_free(ip, i.length);
    const v = new DataView(ex.memory.buffer);
    const total = v.getUint32(res, true);
    const outLen = v.getUint32(res + 8, true);
    const html = new TextDecoder().decode(mem().slice(res + 12, res + 12 + outLen));
    ex.grasm_free(res, total);
    preview.innerHTML = html;
  }

  Promise.all([
    fetch("grasm.wasm", { cache: "no-store" }).then(r => r.arrayBuffer()),
    fetch("bundle.gr", { cache: "no-store" }).then(r => r.text()),
  ]).then(([bytes, text]) => {
    compiled = new WebAssembly.Module(bytes);
    source = text;
    publish.disabled = false;
    status.textContent = "preview compiled here, by the server's own compiler";
    render();
  }).catch(e => {
    status.textContent =
      "must be served over http — a file:// page cannot fetch (" + e.message + ")";
  });

  src.addEventListener("input", render);

  // Publishing is the only round trip. The server compiles the same document
  // with the same code, so the two must agree — and the page says which.
  publish.addEventListener("click", () => {
    fetch(`${API}/save`, { method: "POST", body: src.value })
      .then(r => r.text())
      .then(html => {
        status.textContent = html.trim() === preview.innerHTML.trim()
          ? "published — the server's html matched the preview exactly"
          : "published — but the server's html differs from the preview";
      })
      .catch(() => { status.textContent = "no server: run `grasm run main.gr -- serve`"; });
  });
</script>
