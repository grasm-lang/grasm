<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="A recorded journal replays byte-identically on every engine">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1l7 4-7 4z" fill="#3DDC97"/>
    </marker>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C2B"/>
      <stop offset="1" stop-color="#0C1523"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="20" fill="#0A101C"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="19.25" fill="none" stroke="#1C2838" stroke-width="1.5"/>

  <text x="56" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="2.6" fill="#3DDC97">ACT II &#8212; &#8220;CANNOT REPRODUCE&#8221;</text>
  <text x="56" y="72" font-family="system-ui,-apple-system,Segoe UI,Helvetica,sans-serif" font-size="17" fill="#8FA3B8">every read from outside the program is written down &#8212; and the recording runs anywhere</text>

  <g transform="translate(56,120)">
    <rect width="236" height="150" rx="13" fill="#0E1726" stroke="#22354A"/>
    <text x="24" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#DCE8F4">./server</text>
    <text x="24" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#64788F">production &#183; native &#183; arm64</text>
    <text x="24" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#64788F">it crashed once, at 03:14</text>
    <rect x="24" y="104" width="188" height="28" rx="7" fill="#132031" stroke="#24364C"/>
    <text x="36" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#5BF0AE">GRASM_RECORD=j</text>
  </g>

  <path d="M300 195h50" stroke="#3DDC97" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <g transform="translate(364,110)">
    <rect width="336" height="186" rx="13" fill="url(#tape)" stroke="#25384F"/>
    <rect width="336" height="34" rx="13" fill="#132031"/>
    <rect y="22" width="336" height="12" fill="#132031"/>
    <text x="18" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8FA3B8">j &#8212; 5 records, 264 bytes</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">
      <g fill="#3DDC97">
        <text x="18" y="62">1</text><text x="18" y="86">2</text><text x="18" y="110">3</text><text x="18" y="134">4</text><text x="18" y="158">5</text>
      </g>
      <g fill="#A9BCCF">
        <text x="38" y="62">now_millis</text><text x="38" y="86">env</text><text x="38" y="110">read_file</text><text x="38" y="134">tcp_listen</text><text x="38" y="158">now_millis</text>
      </g>
      <g fill="#64788F">
        <text x="140" y="62">1787564958324</text>
        <text x="140" y="86">Some(&#34;/srv/app&#34;)</text>
        <text x="140" y="110">Ok(&#34;port = 8080&#34;)</text>
        <text x="140" y="158">1787564958324</text>
      </g>
      <text x="140" y="134" fill="#E2563F">Err(Permission denied)</text>
    </g>
    <text x="0" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#64788F">the journal is the whole interface to the outside</text>
  </g>

  <path d="M708 195h58" stroke="#3DDC97" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g>
      <rect x="780" y="110" width="290" height="52" rx="11" fill="#0E1C19" stroke="#2C6B55"/>
      <rect x="780" y="172" width="290" height="52" rx="11" fill="#0E1C19" stroke="#2C6B55"/>
      <rect x="780" y="234" width="290" height="52" rx="11" fill="#0E1C19" stroke="#2C6B55"/>
    </g>
    <g font-size="14.5" fill="#DCE8F4">
      <text x="806" y="142">interpreter</text>
      <text x="806" y="204">native binary</text>
      <text x="806" y="266">wasm</text>
    </g>
    <text x="872" y="266" font-size="11.5" fill="#64788F">&#8212; no OS underneath</text>
    <g stroke="#3DDC97" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1026 134l5 6 10-13"/>
      <path d="M1026 196l5 6 10-13"/>
      <path d="M1026 258l5 6 10-13"/>
    </g>
    <text x="780" y="322" font-size="12" fill="#5BF0AE">byte-identical output, all three</text>
    <text x="780" y="344" font-size="11.5" fill="#64788F">no sockets &#183; no filesystem &#183; no clock &#183; no processes</text>
  </g>

  <rect x="56" y="300" width="236" height="30" rx="7" fill="#132031" stroke="#24364C"/>
  <text x="68" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#5BF0AE">GRASM_REPLAY=j ./server</text>
  <text x="56" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#64788F">a bug report you can run</text>
</svg>
