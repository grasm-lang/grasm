    <g fill="none" stroke="url(#logo)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><path d="M43 5 V57 A19 19 0 0 1 24 76 H9"/><path d="M65 43 V24 A19 19 0 0 1 84 5 H89"/><circle cx="127" cy="24" r="19"/><path d="M146 5 V43"/><path d="M196 5 H178 A9.5 9.5 0 0 0 178 24 H186 A9.5 9.5 0 0 1 186 43 H168"/><path d="M218 43 V21 A16 16 0 0 1 250 21 V43 M250 21 A16 16 0 0 1 282 21 V43"/></g>
