  <rect x="74" y="122" width="300" height="2" fill="url(#rule)"/>

  <text x="74" y="176" font-family="system-ui,-apple-system,Segoe UI,Helvetica,sans-serif" font-size="29" font-weight="600" fill="#EAF2FA">Nothing happens that the code</text>
  <text x="74" y="212" font-family="system-ui,-apple-system,Segoe UI,Helvetica,sans-serif" font-size="29" font-weight="600" fill="#EAF2FA">didn&#8217;t declare.</text>

  <text x="74" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#6E829A" letter-spacing="0.4">effects you can audit &#183; ownership without lifetimes &#183; no collector</text>
  <text x="74" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#6E829A" letter-spacing="0.4">one binary &#183; three engines that agree byte for byte</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <g transform="translate(700,56)">
      <rect width="222" height="112" rx="14" fill="#0E1726" stroke="#1E2C3E"/>
      <text x="111" y="58" font-size="40" font-weight="700" fill="#3DDC97">511</text>
      <text x="111" y="84" font-size="12" fill="#788CA3">programs, identical</text>
    </g>
    <g transform="translate(946,56)">
      <rect width="182" height="112" rx="14" fill="#0E1726" stroke="#1E2C3E"/>
      <text x="91" y="58" font-size="34" font-weight="700" fill="#3DDC97">85.7<tspan font-size="18" fill="#8FA3B8"> KB</tspan></text>
      <text x="91" y="84" font-size="12" fill="#788CA3">hello world, static</text>
