[package]
name = "front"
version = "0.1.0"
entry = "src/main.gr"

# The compiler's frontend in Grasm (docs/self-hosting.md, stage S2): reads a
# source file and prints what the Rust frontend's dump of it prints. It
# reads files and writes to stdout and stderr, and asks the file system
# what a directory's real name is -- `realpath(3)`, called from C as the
# Rust toolchain's `canonicalize` calls it, which is the `unsafe`.
capabilities = ["io", "unsafe"]

# The loader reads manifests with rtoml.gr, a port of the Rust toolchain's
# own reader, so its diagnostics about one are Rust's (docs/self-hosting.md
# §6.13). The TOML package serves only `front toml`, which tomldiff holds to
# the Rust reader and to Python's tomllib.
[dependencies.toml]
path = "../../packages/toml"
version = "^1.0.0"
